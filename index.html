<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M+ Collection Archives Explorer — Architecture</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="app-header">
    <div>
      <h1>M+ Collection Archives Explorer</h1>
      <div class="subtitle">Architecture-related archives in the M+ Collection Archives — 45 fonds</div>
    </div>
    <div class="controls">
      <div class="search-container">
        <input type="text" class="search-input" id="searchInput" placeholder="Search archives, titles, creators..." autocomplete="off">
      </div>
      <div class="filter-buttons" id="sortButtons">
        <button class="filter-btn active" data-sort="name">A–Z</button>
        <button class="filter-btn" data-sort="count">Most items</button>
        <button class="filter-btn" data-sort="arch">Most architectural</button>
      </div>
    </div>
  </header>

  <main>
    <section id="homeView" class="view active">
      <div class="stats-strip" id="statsStrip"></div>
      <div class="arch-grid" id="archGrid"></div>
      <div class="rec-list" id="searchResults"></div>
    </section>

    <section id="archiveView" class="view">
      <div class="crumb"><a id="backLink">← All archives</a></div>
      <div class="arch-head" id="archHead"></div>
      <div class="toolbar">
        <input type="text" class="search-input" id="archSearch" placeholder="Search within this archive..." style="max-width:320px">
        <select id="levelFilter">
          <option value="">All levels</option>
          <option>Series</option><option>Subseries</option><option>Sub-subseries</option>
          <option>File</option><option>Item</option><option>Piece</option>
        </select>
        <select id="catFilter"><option value="">All categories</option></select>
        <span id="recCount" style="font-size:12px;color:var(--text-muted)"></span>
      </div>
      <div class="rec-list" id="recList"></div>
    </section>
  </main>

  <div class="modal-back" id="modalBack"></div>
  <div class="modal" id="itemModal"></div>

  <script src="./archives.js?v=1"></script>
</body>
</html>
